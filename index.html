<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebGIS Persebaran Fasilitas Sidoarjo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- MAPBOX CSS & JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>

    <!-- MAPBOX DIRECTIONS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.2.0/mapbox-gl-directions.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.2.0/mapbox-gl-directions.css" type="text/css">

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { margin:0; padding:0; }
        #map { width: 100%; height: 600px; border-radius: 10px; }

        .legend-box {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 0 5px rgba(0,0,0,0.20);
        }

        .legend-color {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 6px;
            border-radius: 3px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">WebGIS Persebaran Fasilitas Sidoarjo</span>
  </div>
</nav>

<div class="container">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-3">
            <h5><b>Informasi Layer</b></h5>
            <p>WebGIS ini menampilkan persebaran fasilitas publik di Kabupaten Sidoarjo.</p>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="layerSekolah" checked>
              <label class="form-check-label" for="layerSekolah">Sekolah</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="layerRS" checked>
              <label class="form-check-label" for="layerRS">Rumah Sakit</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="layerMasjid" checked>
              <label class="form-check-label" for="layerMasjid">Masjid</label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="layerGereja" checked>
              <label class="form-check-label" for="layerGereja">Gereja</label>
            </div>

            <hr>

            <div class="legend-box">
                <div><span class="legend-color" style="background:#1E90FF"></span> Sekolah</div>
                <div><span class="legend-color" style="background:#FF0000"></span> Rumah Sakit</div>
                <div><span class="legend-color" style="background:#008000"></span> Masjid</div>
                <div><span class="legend-color" style="background:#8B4513"></span> Gereja</div>
            </div>
        </div>

        <!-- MAP -->
        <div class="col-md-9">
            <div id="map"></div>
        </div>

    </div>
</div>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYXRpcW9oIiwiYSI6ImNtbnEyandhYzAzYjEyeHB5aDZwdzUweXcifQ.-JH954kbI7eXec_E4mGAOg';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12',
        center: [112.72, -7.45], 
        zoom: 10.5
    });

    // Tambahkan kontrol rute
    const directions = new MapboxDirections({
    accessToken: mapboxgl.accessToken,
    unit: 'metric',
    profile: 'mapbox/driving'
    });
    map.addControl(directions, 'top-left');

    map.on('load', () => {
        // SEKOLAH
        map.addSource('sekolah', { type: 'geojson', data: 'assets/SCHOOL GEOJSON.geojson' });
        map.addLayer({
            id: 'sekolah', type: 'circle', source: 'sekolah',
            paint: { 'circle-radius': 6, 'circle-color': '#1E90FF' }
        });

        // RUMAH SAKIT
        map.addSource('rs', { type: 'geojson', data: 'assets/HOSPITAL GEOJSON.geojson' });
        map.addLayer({
            id: 'rs', type: 'circle', source: 'rs',
            paint: { 'circle-radius': 7, 'circle-color': '#FF0000' }
        });

        // MASJID
        map.addSource('masjid', { type: 'geojson', data: 'assets/MOSQUE GEOJSON.geojson' });
        map.addLayer({
            id: 'masjid', type: 'circle', source: 'masjid',
            paint: { 'circle-radius': 6, 'circle-color': '#008000' }
        });

        // GEREJA
        map.addSource('gereja', { type: 'geojson', data: 'assets/CHURCH GEOJSON.geojson' });
        map.addLayer({
            id: 'gereja', type: 'circle', source: 'gereja',
            paint: { 'circle-radius': 6, 'circle-color': '#8B4513' }
        });

        function setPopup(layer) {
            map.on('click', layer, (e) => {
                const p = e.features[0].properties;
                new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`<b>${p.nama || 'Data'}</b><br>${p.keterangan || ''}`)
                    .addTo(map);
            });
        }

        setPopup('sekolah');
        setPopup('rs');
        setPopup('masjid');
        setPopup('gereja');
    });

    function setPopup(layerName) {
    map.on('click', layerName, (e) => {
        const coords = e.lngLat;
        const p = e.features[0].properties;

        new mapboxgl.Popup()
            .setLngLat(coords)
            .setHTML(`
                <b>${p.nama || 'Lokasi'}</b><br>
                ${p.keterangan || ''}<br><br>
                <button id="btnRute" class="btn btn-sm btn-primary">Tampilkan Rute</button>
            `)
            .addTo(map);

        // TOMBOL RUTE
        setTimeout(() => {
            const btn = document.getElementById('btnRute');
            if (btn) {
                btn.onclick = () => {
                    // Gunakan posisi user sebagai titik awal
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const userLng = pos.coords.longitude;
                            const userLat = pos.coords.latitude;

                            directions.setOrigin([userLng, userLat]);
                            directions.setDestination([coords.lng, coords.lat]);
                        },
                        () => {
                            alert("Lokasi kamu tidak bisa diakses.");
                        }
                    );
                };
            }
        }, 100);
    });
}

    // TOGGLE
    document.getElementById('layerSekolah').onchange = (e) =>
        map.setLayoutProperty('sekolah','visibility', e.target.checked?'visible':'none');

    document.getElementById('layerRS').onchange = (e) =>
        map.setLayoutProperty('rs','visibility', e.target.checked?'visible':'none');

    document.getElementById('layerMasjid').onchange = (e) =>
        map.setLayoutProperty('masjid','visibility', e.target.checked?'visible':'none');

    document.getElementById('layerGereja').onchange = (e) =>
        map.setLayoutProperty('gereja','visibility', e.target.checked?'visible':'none');
</script>

    <footer class="bg-dark text-white text-center py-3 mt-4">
    <small>copyright @ Tuhfatul.Atiqoh117230061.2026</small>
</footer>

</body>
</html>
